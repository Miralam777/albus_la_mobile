group = "de.mir7.zebra_utils"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "de.mir7.zebra_utils"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    // TODO: new for zebra_utils
    lintOptions {
        checkReleaseBuilds false
    }
    // lintOptions {
        // disable 'InvalidPackage'
    // }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        testImplementation("junit:junit:4.13.2")
        testImplementation("org.mockito:mockito-core:5.0.0")
        // TODO: new
        implementation fileTree(include: '*.jar', dir: 'libs')
        // implementation files('libs/zsdk_api.jar')
        implementation 'com.fasterxml.jackson.core:jackson-annotations:2.2.3'
        implementation 'com.fasterxml.jackson.core:jackson-core:2.2.3'
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.2.3'
        implementation 'com.joanzapata.pdfview:android-pdfview:1.0.4@aar'
        // TODO: new
        // implementation 'com.zebra:zebra-android-sdk:2.15.2630'
    }

    testOptions {
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}